[env]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified

; Main firmware: menu + apps
[env:cardputer-adv]
build_src_filter = +<*> -<wifitest/>

; Wi-Fi diagnostic firmware (pio run -e wifitest)
[env:wifitest]
build_src_filter = +<wifitest/>
